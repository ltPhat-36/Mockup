<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh sách sản phẩm</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
    <h3 class="mb-3">Danh sách sản phẩm</h3>

    <!-- Thanh công cụ -->
    <div class="row mb-3 g-2">
        <div class="col-md-4">
            <input type="text" id="searchInput" class="form-control" placeholder="Tìm theo tên...">
        </div>
        <div class="col-md-3">
            <select id="sortSelect" class="form-select">
                <option value="">Sắp xếp...</option>
                <option value="name,asc">Tên A-Z</option>
                <option value="name,desc">Tên Z-A</option>
                <option value="price,asc">Giá tăng dần</option>
                <option value="price,desc">Giá giảm dần</option>
            </select>
        </div>
    </div>

    <!-- Danh sách sản phẩm -->
    <div id="productList" class="row g-3"></div>

    <!-- Phân trang -->
    <nav class="mt-4">
        <ul id="pagination" class="pagination justify-content-center"></ul>
    </nav>
</div>

<script>
const API_BASE = "http://localhost:8080/api2025";

// 1. Kiểm tra quyền
let currentUser = null;
try { currentUser = JSON.parse(localStorage.getItem("currentUser")); } catch (_) {}
if (!currentUser || currentUser.role !== "CUSTOMER") {
    alert("Bạn chưa đăng nhập hoặc không có quyền!");
    window.location.href = "index.html";
    throw new Error("Not authorized");
}

// 2. DOM element
const productList = document.getElementById("productList");
const pagination = document.getElementById("pagination");
const searchInput = document.getElementById("searchInput");
const sortSelect = document.getElementById("sortSelect");

let currentPage = 0;
const pageSize = 6;

// 3. Tải sản phẩm (không cần token)
async function loadProducts() {
    const search = searchInput.value.trim();
    const sort = sortSelect.value;

    let url = `${API_BASE}/products?page=${currentPage}&size=${pageSize}`;
    if (search) url += `&name=${encodeURIComponent(search)}`;
    if (sort)   url += `&sort=${encodeURIComponent(sort)}`;

    try {
        const res = await fetch(url);
        if (!res.ok) throw new Error("Không tải được sản phẩm");
        const data = await res.json();

        renderProducts(data.content || []);
        renderPagination(data.totalPages || 0);
    } catch (err) {
        console.error("Lỗi:", err);
        productList.innerHTML = "<p class='text-danger'>Không tải được sản phẩm</p>";
        pagination.innerHTML = "";
    }
}

function renderProducts(products) {
    productList.innerHTML = "";
    products.forEach(p => {
        const col = document.createElement("div");
        col.className = "col-md-4";
        const imgPath = p.imageUrl ? p.imageUrl : "/uploads/no-image.png";
        const priceStr = Number(p.price || 0).toLocaleString("vi-VN");

        col.innerHTML = `
            <div class="card h-100 shadow-sm">
                <img src="http://localhost:8080${imgPath}" class="card-img-top" alt="${escapeHtml(p.name || '')}">
                <div class="card-body">
                    <h5 class="card-title">${escapeHtml(p.name || '')}</h5>
                    <p class="card-text">${escapeHtml(p.description || '')}</p>
                    <p class="text-primary fw-bold">${priceStr} VND</p>
                </div>
            </div>
        `;
        productList.appendChild(col);
    });
}

function renderPagination(totalPages) {
    pagination.innerHTML = "";
    for (let i = 0; i < totalPages; i++) {
        const li = document.createElement("li");
        li.className = `page-item ${i === currentPage ? "active" : ""}`;
        const a = document.createElement("a");
        a.className = "page-link";
        a.href = "#";
        a.innerText = (i + 1).toString();
        a.addEventListener("click", e => {
            e.preventDefault();
            currentPage = i;
            loadProducts();
        });
        li.appendChild(a);
        pagination.appendChild(li);
    }
}

function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, m => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]
    ));
}

// 4. Event filter + sort
searchInput.addEventListener("input", () => {
    currentPage = 0;
    loadProducts();
});
sortSelect.addEventListener("change", () => {
    currentPage = 0;
    loadProducts();
});

// 5. Load lần đầu
loadProducts();
</script>
</body>
</html>
