      <div class="email-pagination"><span id="emailRange">Showing 0</span><div class="pagination"><span>Show</span><select id="emailPageSize" class="page-size"><option value="10">10 records</option><option value="25">25 records</option><option value="50">50 records</option></select><button class="page-btn" id="prevEmailPage" aria-label="Previous page">‹</button><span id="emailPageLabel" class="page-number">1 / 1</span><button class="page-btn" id="nextEmailPage" aria-label="Next page">›</button></div></div>
    </section>
  </div>
</aside>
<div class="dialog-shade" id="dialogShade"><div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dialogTitle"><h3 id="dialogTitle"></h3><p id="dialogText"></p><div class="dialog-footer"><button class="btn btn-secondary" id="dialogCancel">Cancel</button><button class="btn btn-danger" id="dialogConfirm">Confirm</button></div></div></div>
<div class="toast" id="toast"><svg><use href="#i-check"/></svg><span id="toastText"></span></div>
<script>
(function(){
'use strict';
const STORAGE_KEY='vna_report_email_delivery_mockup_v1';
const seed=[
{id:'RPT-001',name:'Start-of-Day Flight Report',emails:['operations.report@gmail.com','ops.supervisor@gmail.com']},
{id:'RPT-002',name:'Weekly Operations Overview Report',emails:['dispatch.team@gmail.com']},
{id:'RPT-003',name:'Weekly Airport OTP/OSP Report',emails:['loadcontrol.vn@gmail.com','duty.manager@gmail.com']},
{id:'RPT-004',name:'Flight Delay Report',emails:['station.manager@gmail.com']},
{id:'RPT-005',name:'Flight Cancellation Report',emails:['operations.report@gmail.com','planning.report@gmail.com','admin.report@gmail.com']}
];
const $=id=>document.getElementById(id);
const sym=name=>`<svg aria-hidden="true"><use href="#i-${name}"/></svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let stored=null;try{stored=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null')}catch(_){}
let reports=Array.isArray(stored?.reports)&&stored.reports.length?stored.reports.map(r=>({...r,name:seed.find(item=>item.id===r.id)?.name||r.name,emails:Array.isArray(r.emails)?r.emails:[],autoSendEnabled:typeof r.autoSendEnabled==='boolean'?r.autoSendEnabled:stored?.jobEnabled!==false})):seed.map(r=>({...r,updated:'10/11/2026 09:15',editor:'System Admin',autoSendEnabled:true}));
let appliedFilter={name:'',email:''};
let panel=null,detailId=null,detailPage=1,detailPageSize=10,editEmail=null;
let selected=new Set(),globalEmails=[],pendingAction=null,pickerOpen=false,toastTimer=null,globalEditingIndex=null;
const validEmail=x=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(x);
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({reports}))}catch(_){}}
function stamp(){const d=new Date();const z=n=>String(n).padStart(2,'0');return `${z(d.getDate())}/${z(d.getMonth()+1)}/${d.getFullYear()} ${z(d.getHours())}:${z(d.getMinutes())}`;}
function touch(r){r.updated=stamp();r.editor='Current User'}
function toast(s){$('toastText').textContent=s;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),3200)}
function renderReports(){
  const list=reports.filter(r=>(!appliedFilter.name||r.name.toLowerCase().includes(appliedFilter.name))&&(!appliedFilter.email||r.emails.some(e=>e.toLowerCase().includes(appliedFilter.email))));
  $('reportsRows').innerHTML=list.map(r=>`<tr>
    <td class="col-no">${reports.indexOf(r)+1}</td>
    <td><span class="report-name-text" title="${esc(r.name)}">${esc(r.name)}</span></td>
    <td><span class="count-label" title="${r.emails.length} configured recipient emails">${sym('mail')} ${r.emails.length} email${r.emails.length===1?'':'s'}</span></td>
    <td class="subtle">${esc(r.updated||'—')}</td>
    <td><span class="person">${esc(r.editor||'System Admin')}</span></td>
    <td class="auto-send-cell"><div class="auto-send-cell-inner"><span class="status-pill ${r.autoSendEnabled?'enabled':'disabled'}" title="${r.autoSendEnabled?'Automatic report email delivery is on':'Automatic report email delivery is off'}">${r.autoSendEnabled?'Auto Send On':'Auto Send Off'}</span></div></td>
    <td class="col-actions"><button class="icon-btn" type="button" data-edit-detail="${esc(r.id)}" title="Edit recipients" aria-label="Edit recipients for ${esc(r.name)}">${sym('edit')}</button></td>
  </tr>`).join('')||'<tr><td colspan="7" style="text-align:center;padding:32px;color:#9aabb6">No matching records found.</td></tr>';
}
function changeReportDelivery(id){
  const report=reports.find(r=>r.id===id);if(!report)return;
  const activate=!report.autoSendEnabled;
  const apply=()=>{
    report.autoSendEnabled=activate;
    touch(report);save();renderReports();
    if(detailId===id&&panel==='detail')renderDetail();
    toast(`Automatic email delivery ${activate?'enabled':'disabled'} for ${report.name}.`);
  };
  if(activate){apply();return;}
  openConfirm({title:'Disable automatic delivery?',text:`Automatic emails for ${report.name} will stop. Recipient email configurations will be retained.`,confirmLabel:'Disable',onConfirm:apply});
}
function closeAllPanels(){panel=null;$('shade').classList.remove('open');['addPanel','detailPanel'].forEach(id=>{$(id).classList.remove('open');$(id).setAttribute('aria-hidden','true')});setPicker(false);editEmail=null;}
function showPanel(type){closeAllPanels();panel=type;$('shade').classList.add('open');const p=$(type==='add'?'addPanel':'detailPanel');p.classList.add('open');p.setAttribute('aria-hidden','false');}
function openEdit(id){
 const r=reports.find(x=>x.id===id);if(!r)return;
 detailId=id;detailPage=1;editEmail=null;
 $('detailSearch').value='';
 clearDetailError();showPanel('detail');renderDetail();
}
function renderDetail(){const r=reports.find(x=>x.id===detailId);if(!r)return;$('detailTitle').textContent='Edit Report';$('detailReportName').textContent=r.name;$('detailAutoSendToggle').classList.toggle('on',!!r.autoSendEnabled);$('detailAutoSendToggle').setAttribute('aria-checked',String(!!r.autoSendEnabled));$('detailAutoSendToggle').setAttribute('title',`${r.autoSendEnabled?'Disable':'Enable'} automatic email delivery`);$('detailEmailCount').textContent=r.emails.length;$('detailDeleteAll').disabled=r.emails.length===0;const found=r.emails.slice().reverse();const pages=Math.max(1,Math.ceil(found.length/detailPageSize));detailPage=Math.min(detailPage,pages);const start=(detailPage-1)*detailPageSize;const show=found.slice(start,start+detailPageSize);$('emailsRows').innerHTML=show.map(e=>{
 if(e===editEmail)return `<div class="email-row"><div class="inline-edit"><input class="control" id="inlineEmail" type="email" value="${esc(e)}" aria-label="Edit recipient email"/><button class="icon-btn save-icon" data-save-inline="${esc(e)}" title="Save" aria-label="Save email">${sym('check')}</button><button class="icon-btn" data-cancel-inline title="Cancel" aria-label="Cancel editing">${sym('x')}</button></div></div>`;
 return `<div class="email-row"><span class="email-text">${esc(e)}</span><div class="email-actions"><button class="icon-btn" data-edit-email="${esc(e)}" title="Edit email" aria-label="Edit ${esc(e)}">${sym('edit')}</button><button class="icon-btn danger" data-delete-email="${esc(e)}" title="Delete email" aria-label="Delete ${esc(e)}">${sym('trash')}</button></div></div>`
 }).join('')||'<div class="email-empty">No recipient emails found.</div>';
 $('emailRange').textContent=found.length?`Showing ${start+1}–${Math.min(found.length,start+detailPageSize)} of ${found.length}`:'Showing 0';$('emailPageLabel').textContent=`${detailPage} / ${pages}`;$('prevEmailPage').disabled=detailPage<=1;$('nextEmailPage').disabled=detailPage>=pages;}
function openAdd(){selected.clear();globalEmails=[];globalEditingIndex=null;$('globalEmail').value='';$('globalError').textContent='';$('pickerSearch').value='';setPicker(false);renderPicker();renderChips('global');showPanel('add');}
function setPicker(open){pickerOpen=Boolean(open)&&panel==='add';$('pickerPop').classList.toggle('open',pickerOpen);$('pickerTrigger').setAttribute('aria-expanded',String(pickerOpen));if(pickerOpen){renderPicker();$('pickerSearch').focus()}}
function visiblePicker(){const q=$('pickerSearch').value.trim().toLowerCase();return reports.filter(r=>r.name.toLowerCase().includes(q));}
function renderPicker(){const visible=visiblePicker();$('pickerList').innerHTML=visible.map(r=>`<label class="multi-option"><input type="checkbox" value="${esc(r.id)}" ${selected.has(r.id)?'checked':''}/><span class="multi-label">${esc(r.name)}</span></label>`).join('')||'<div class="email-empty">No reports found.</div>';$('pickerValue').textContent=selected.size?`${selected.size} report${selected.size===1?'':'s'} selected`:'Select reports';$('pickerCount').textContent=`${selected.size}/${reports.length}`;}
function renderChips(which){
  $('globalChipCount').textContent=globalEmails.length;
  $('globalChips').innerHTML=globalEmails.map((email,i)=>{
    if(i===globalEditingIndex){
      return `<div class="email-row"><div class="inline-edit"><input class="control" id="globalInlineEmail" type="email" value="${esc(email)}" aria-label="Edit recipient email"/><button type="button" class="icon-btn save-icon" data-save-global="${i}" title="Save" aria-label="Save email">${sym('check')}</button><button type="button" class="icon-btn" data-cancel-global title="Cancel" aria-label="Cancel editing">${sym('x')}</button></div></div>`;
    }
    return `<div class="email-row"><span class="email-text" title="${esc(email)}">${esc(email)}</span><div class="email-actions"><button type="button" class="icon-btn" data-edit-global="${i}" title="Edit email" aria-label="Edit ${esc(email)}">${sym('edit')}</button><button type="button" class="icon-btn danger" data-remove-global="${i}" title="Delete email" aria-label="Delete ${esc(email)}">${sym('trash')}</button></div></div>`;
  }).join('')||'<div class="email-empty">No recipient emails added.</div>';
}
function saveGlobalInline(){
  if(globalEditingIndex===null)return true;
  const inp=$('globalInlineEmail');if(!inp)return false;
  const email=inp.value.trim().toLowerCase();
  if(!validEmail(email)){$('globalError').textContent='Enter a valid email address.';inp.focus();return false;}
  if(globalEmails.some((e,i)=>i!==globalEditingIndex&&e.toLowerCase()===email)){$('globalError').textContent='This email is already in the list.';inp.focus();return false;}
  globalEmails[globalEditingIndex]=email;globalEditingIndex=null;$('globalError').textContent='';renderChips('global');return true;
}
function parseEmails(raw){return String(raw).split(/[\s,;]+/).map(x=>x.trim().toLowerCase()).filter(Boolean)}
function queueEmails(which){if(globalEditingIndex!==null&&!saveGlobalInline())return false;const inp=$('globalEmail'),error=$('globalError'),existing=globalEmails;const entries=parseEmails(inp.value);error.textContent='';if(!entries.length){error.textContent='Enter an email address.';return false}const invalid=entries.filter(x=>!validEmail(x));if(invalid.length){error.textContent=`Invalid email: ${invalid[0]}`;return false}let added=0;for(const e of entries)if(!existing.includes(e)){existing.push(e);added++}inp.value='';renderChips('global');if(!added){error.textContent='All entered emails are already listed.';return false}inp.focus();return true}
function setUpEmailInput(which){const inp=$('globalEmail');inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();queueEmails('global')}});inp.addEventListener('input',()=>$('globalError').textContent='');inp.addEventListener('paste',e=>{const raw=e.clipboardData?.getData('text/plain')||'';if(/[\r\n\t;,]/.test(raw)){e.preventDefault();inp.value=raw;queueEmails('global')}})}
function saveGlobal(){if(globalEditingIndex!==null&&!saveGlobalInline())return;if(!selected.size){$('globalError').textContent='Select at least one report.';setPicker(true);return}const typed=$('globalEmail').value.trim();if(typed&&!queueEmails('global'))return;if(!globalEmails.length){$('globalError').textContent='Add at least one email address.';return}let added=0,changed=0;for(const r of reports){if(!selected.has(r.id))continue;let update=false;for(const e of globalEmails){if(!r.emails.some(x=>x.toLowerCase()===e)){r.emails.push(e);added++;update=true}}if(update){touch(r);changed++}}if(!added){$('globalError').textContent='These emails are already assigned to the selected reports.';return}save();renderReports();closeAllPanels();toast(`${added} email assignment${added===1?'':'s'} added to ${changed} report${changed===1?'':'s'}.`)}
function clearDetailError(){const el=$('detailEntryError');el.textContent='';el.classList.remove('has-error');}
function showDetailError(message){const el=$('detailEntryError');el.textContent=message;el.classList.add('has-error');}
function addRecipientInline(){
 const r=reports.find(x=>x.id===detailId);if(!r)return;
 const input=$('detailSearch');const entries=parseEmails(input.value);
 clearDetailError();
 if(!entries.length){showDetailError('Enter an email address.');input.focus();return;}
 const invalid=entries.find(email=>!validEmail(email));
 if(invalid){showDetailError(`Enter a valid email address: ${invalid}`);input.focus();return;}
 const existing=new Set(r.emails.map(email=>email.toLowerCase()));
 const fresh=[];
 for(const email of entries){if(!existing.has(email)){fresh.push(email);existing.add(email);}}
 if(!fresh.length){showDetailError('This email is already assigned to this report.');input.focus();return;}
 r.emails.push(...fresh);
 touch(r);save();renderReports();
 input.value='';editEmail=null;
 detailPage=1;
 renderDetail();input.focus();
 const skipped=entries.length-fresh.length;
 toast(`${fresh.length} recipient email${fresh.length===1?'':'s'} added${skipped?`; ${skipped} duplicate${skipped===1?'':'s'} skipped`:''}.`);
}
function saveInline(original){const inp=$('inlineEmail');if(!inp)return;const v=inp.value.trim().toLowerCase();if(!validEmail(v)){toast('Enter a valid email address.');inp.focus();return}const r=reports.find(x=>x.id===detailId);if(!r)return;if(r.emails.some(x=>x.toLowerCase()===v&&x!==original)){toast('This email is already assigned to this report.');inp.focus();return}const i=r.emails.indexOf(original);if(i<0)return;r.emails[i]=v;touch(r);editEmail=null;save();renderReports();renderDetail();toast('Recipient email updated.');}
function openConfirm({title,text,confirmLabel,danger=true,onConfirm}){pendingAction=onConfirm;$('dialogTitle').textContent=title;$('dialogText').textContent=text;$('dialogConfirm').textContent=confirmLabel;$('dialogConfirm').className='btn '+(danger?'btn-danger':'btn-primary');$('dialogShade').classList.add('open');}
function closeConfirm(){$('dialogShade').classList.remove('open');pendingAction=null;}
$('filterForm').addEventListener('submit',e=>{e.preventDefault();appliedFilter={name:$('filterName').value.trim().toLowerCase(),email:$('filterEmail').value.trim().toLowerCase()};renderReports()});$('clearFilter').addEventListener('click',()=>{$('filterName').value='';$('filterEmail').value='';appliedFilter={name:'',email:''};renderReports()});
$('reportsRows').addEventListener('click',e=>{const edit=e.target.closest('[data-edit-detail]');if(edit)openEdit(edit.dataset.editDetail);});
$('shade').addEventListener('click',closeAllPanels);$('closeAdd').addEventListener('click',closeAllPanels);$('globalCancel').addEventListener('click',closeAllPanels);$('closeDetail').addEventListener('click',closeAllPanels);$('detailAutoSendToggle').addEventListener('click',()=>{if(detailId)changeReportDelivery(detailId);});
$('pickerTrigger').addEventListener('click',()=>setPicker(!pickerOpen));$('pickerSearch').addEventListener('input',renderPicker);$('pickerList').addEventListener('change',e=>{const c=e.target.closest('input[type=checkbox]');if(!c)return;if(c.checked)selected.add(c.value);else selected.delete(c.value);renderPicker()});$('pickerSelectAll').addEventListener('click',()=>{visiblePicker().forEach(r=>selected.add(r.id));renderPicker()});$('pickerClear').addEventListener('click',()=>{selected.clear();renderPicker()});document.addEventListener('pointerdown',e=>{if(pickerOpen&&!e.target.closest('#picker'))setPicker(false)});
setUpEmailInput('global');$('globalChipAdd').addEventListener('click',()=>queueEmails('global'));$('globalClearChips').addEventListener('click',()=>{globalEmails=[];globalEditingIndex=null;$('globalError').textContent='';renderChips('global')});$('globalChips').addEventListener('click',e=>{
  const edit=e.target.closest('[data-edit-global]');
  const remove=e.target.closest('[data-remove-global]');
  const commit=e.target.closest('[data-save-global]');
  const cancel=e.target.closest('[data-cancel-global]');
  if(edit){if(globalEditingIndex!==null&&!saveGlobalInline())return;globalEditingIndex=Number(edit.dataset.editGlobal);$('globalError').textContent='';renderChips('global');$('globalInlineEmail')?.focus();$('globalInlineEmail')?.select();}
  else if(remove){const idx=Number(remove.dataset.removeGlobal);globalEmails.splice(idx,1);if(globalEditingIndex!==null){if(globalEditingIndex===idx)globalEditingIndex=null;else if(globalEditingIndex>idx)globalEditingIndex--;}$('globalError').textContent='';renderChips('global');}
  else if(commit)saveGlobalInline();
  else if(cancel){globalEditingIndex=null;$('globalError').textContent='';renderChips('global');}
});
$('globalChips').addEventListener('keydown',e=>{if(e.target.id!=='globalInlineEmail')return;if(e.key==='Enter'){e.preventDefault();saveGlobalInline()}else if(e.key==='Escape'){e.stopPropagation();globalEditingIndex=null;$('globalError').textContent='';renderChips('global')}});
$('globalSave').addEventListener('click',saveGlobal);
$('detailSearch').addEventListener('input',clearDetailError);
$('detailSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addRecipientInline();}});
$('detailDeleteAll').addEventListener('click',()=>{
 const r=reports.find(x=>x.id===detailId);if(!r||!r.emails.length)return;
 const count=r.emails.length;const reportId=r.id;
 openConfirm({
  title:'Delete all recipient emails?',
  text:`Are you sure you want to delete all ${count} recipient email${count===1?'':'s'} from ${r.name}? This removes recipients from this report only and cannot be undone.`,
  confirmLabel:'Delete All',
  onConfirm:()=>{
   const target=reports.find(x=>x.id===reportId);if(!target)return;
   const removed=target.emails.length;if(!removed)return;
   target.emails=[];editEmail=null;detailPage=1;clearDetailError();
   touch(target);save();renderReports();if(panel==='detail'&&detailId===reportId)renderDetail();
   toast(`${removed} recipient email${removed===1?'':'s'} deleted from ${target.name}.`);
  }
 });
});
$('detailSearchAction').addEventListener('click',addRecipientInline);$('emailPageSize').addEventListener('change',e=>{detailPageSize=Number(e.target.value)||10;detailPage=1;renderDetail()});$('prevEmailPage').addEventListener('click',()=>{detailPage--;renderDetail()});$('nextEmailPage').addEventListener('click',()=>{detailPage++;renderDetail()});
$('emailsRows').addEventListener('click',e=>{const edit=e.target.closest('[data-edit-email]'),del=e.target.closest('[data-delete-email]'),cancel=e.target.closest('[data-cancel-inline]'),confirm=e.target.closest('[data-save-inline]');if(edit){editEmail=edit.dataset.editEmail;renderDetail();$('inlineEmail')?.focus()}else if(cancel){editEmail=null;renderDetail()}else if(confirm){saveInline(confirm.dataset.saveInline)}else if(del){const email=del.dataset.deleteEmail;openConfirm({title:'Delete recipient email?',text:`${email} will be removed from this report only.`,confirmLabel:'Delete',onConfirm:()=>{const r=reports.find(x=>x.id===detailId);if(!r)return;const i=r.emails.indexOf(email);if(i>=0){r.emails.splice(i,1);touch(r);save();renderReports();renderDetail();toast('Recipient email deleted.')}}})}});
$('emailsRows').addEventListener('keydown',e=>{if(e.target.id==='inlineEmail'){if(e.key==='Enter'){e.preventDefault();saveInline(editEmail)}else if(e.key==='Escape'){e.stopPropagation();editEmail=null;renderDetail()}}});
$('dialogCancel').addEventListener('click',closeConfirm);$('dialogShade').addEventListener('click',e=>{if(e.target===$('dialogShade'))closeConfirm()});$('dialogConfirm').addEventListener('click',()=>{const cb=pendingAction;closeConfirm();if(cb)cb()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('dialogShade').classList.contains('open'))closeConfirm();else if(pickerOpen)setPicker(false);else if(panel)closeAllPanels()}});
document.querySelectorAll('[data-demo-nav]').forEach(b=>b.addEventListener('click',()=>toast('Only Report Email Delivery is included in this mockup.')));
renderReports();renderPicker();renderChips('global');
})();
</script></body></html>
